name: Build IPA

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project Browser.xcodeproj \
            -scheme Browser \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tee xcodebuild.log | grep -E "error:|warning: .*(Swift|swift)|BUILD (SUCCEEDED|FAILED)|\*\*" || true
          test -d build/Build/Products/Release-iphoneos/Browser.app || { grep -E "error:" -A3 xcodebuild.log | head -100; exit 1; }

      - name: Package IPA
        run: |
          rm -rf Payload Browser.ipa
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Browser.app Payload/
          zip -qry Browser.ipa Payload
          ls -lh Browser.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Browser-ipa
          path: Browser.ipa
          if-no-files-found: error

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
